name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# CI only reads the repo (and downloads public release assets); no writes needed.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR: every push otherwise queues
# a full duplicate job matrix (m1-tools#27).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stylua:
    name: Lua Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/

  test:
    name: Tests (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4 pins the README's stated minimum so the 0.10-specific
        # `vim.lsp.Client.request` call form stays covered (it differs from
        # 0.11+); stable/nightly track the moving targets.
        neovim: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Check out plenary.nvim
        uses: actions/checkout@v7
        with:
          repository: nvim-lua/plenary.nvim
          path: deps/plenary.nvim

      - name: Check out telescope.nvim
        uses: actions/checkout@v7
        with:
          repository: nvim-telescope/telescope.nvim
          ref: 0.1.8
          path: deps/telescope.nvim

      - name: Install verified catalogue binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          for tool in m1-lint m1-typecheck; do
            gh release download --repo "C-Nucifora/$tool" \
              --pattern "$tool-x86_64-unknown-linux-gnu" \
              -O "$HOME/.local/bin/$tool"
            gh attestation verify "$HOME/.local/bin/$tool" --repo "C-Nucifora/$tool"
            chmod +x "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          M1_REQUIRE_CATALOGUES: "1"
          PLENARY_PATH: ${{ github.workspace }}/deps/plenary.nvim
          TELESCOPE_PATH: ${{ github.workspace }}/deps/telescope.nvim
        run: scripts/test.sh
